# Public template. Copy to wrangler.local.toml and fill in your deployment values.
# Never commit wrangler.local.toml; CI creates wrangler.deploy.toml from Actions variables.
name = "speedquality"
main = "src/index.js"
compatibility_date = "2026-09-26"
workers_dev = false
routes = [{ pattern = "sq.yolo2.cc", custom_domain = true }]

[triggers]
crons = ["17 3 * * *"]

[vars]
LOG_LEVEL = "info"
GITHUB_OWNER = "rtw1248"
GITHUB_REPO = "speedquality"
GITHUB_REF = "v1.5.0"
RESULT_TTL_DAYS = "90"
DAILY_RESULT_LIMIT = "100"
DAILY_SESSION_LIMIT = "20"
NQ_BINDING_ENABLED = "true"
TASK_SCHEDULER_ENABLED = "true"
PROBE_VERSION = "v1.5.0"
PROMOTION_TEXT = ""
PROMOTION_URL = ""

[[services]]
binding = "NODE_CORE"
service = "speedquality-node-core"

[[d1_databases]]
binding = "DB"
database_name = "speedquality-results"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "SNAPSHOTS"
bucket_name = "speedquality-nodequality"

# Required secrets:
#   wrangler secret put RATE_LIMIT_SALT --config wrangler.local.toml
# Self-hosted static mode:
#   wrangler secret put STATIC_NODES --config wrangler.local.toml
# Dynamic Provider mode:
#   wrangler secret put NODE_CORE_SECRET --config wrangler.local.toml
