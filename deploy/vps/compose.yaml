name: speedquality-vps

x-common: &common
  image: ${SQ_PLATFORM_IMAGE:-speedquality-platform:1.2.0-redis}
  pull_policy: never
  restart: unless-stopped
  init: true
  user: "${SQ_UID:?Run admin init first}:${SQ_GID:?Run admin init first}"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ["/tmp:rw,noexec,nosuid,size=32m"]
  mem_limit: 1g
  cpus: 1.0
  stop_grace_period: 70s
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  web:
    <<: *common
    build:
      context: ../..
      dockerfile: deploy/vps/Dockerfile
    environment:
      SQ_CONFIG: /config/public.json
      NODE_OPTIONS: --max-old-space-size=512
    ports:
      - "127.0.0.1:${SQ_PUBLIC_PORT:-52800}:52800"
    volumes:
      - ${SQ_CONFIG_DIR:?}/public.json:/config/public.json:ro
      - ${SQ_PUBLIC_DATA:?}:/data
    depends_on:
      core:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:52800/health',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  core:
    <<: *common
    command: [node, /core/server.mjs]
    environment:
      SQ_CONFIG: /config/core.json
      SQ_RUNTIME_DIR: /app/deploy/vps/lib
      NODE_OPTIONS: --max-old-space-size=512
    volumes:
      - ${SQ_CORE_DIR:?}:/core:ro
      - ${SQ_CONFIG_DIR:?}/core.json:/config/core.json:ro
      - ${SQ_CORE_DATA:?}:/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:52801/health',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    user: "${SQ_UID:?Run admin init first}:${SQ_GID:?Run admin init first}"
    command: [redis-server, /usr/local/etc/redis/redis.conf]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
    cpus: 0.5
    volumes:
      - ${SQ_CONFIG_DIR:?}/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ${SQ_CONFIG_DIR:?}/data/redis:/data
    healthcheck:
      test: [CMD-SHELL, 'export REDISCLI_AUTH=$$(awk ''/^requirepass / {print $$2}'' /usr/local/etc/redis/redis.conf); test "$$(redis-cli ping)" = PONG']
      interval: 10s
      timeout: 3s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
