name: deploy-speedquality-worker

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Existing signed release tag to deploy
        required: true
        default: v1.0.0
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify release tag
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
        run: |
          [[ "$RELEASE_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          git rev-parse --verify --quiet "refs/tags/$RELEASE_REF"
      - name: Prepare deployment config
        env:
          SQ_D1_DATABASE_ID: ${{ vars.SQ_D1_DATABASE_ID }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          database_id = os.environ.get("SQ_D1_DATABASE_ID", "")
          if not re.fullmatch(r"[0-9a-fA-F]{8}(?:-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}", database_id) or database_id == "00000000-0000-0000-0000-000000000000":
              raise SystemExit("Set the SQ_D1_DATABASE_ID Actions variable before deploying")
          directory = Path("deploy/cloudflare-worker")
          template = (directory / "wrangler.toml").read_text()
          placeholder = 'database_id = "00000000-0000-0000-0000-000000000000"'
          if template.count(placeholder) != 1:
              raise SystemExit("Expected exactly one database ID placeholder")
          (directory / "wrangler.deploy.toml").write_text(
              template.replace(placeholder, f'database_id = "{database_id}"')
          )
          PY
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: deploy/cloudflare-worker
          wranglerVersion: 4.141.0
          command: >-
            deploy --config wrangler.deploy.toml
            --var GITHUB_OWNER:${{ github.repository_owner }}
            --var GITHUB_REPO:${{ github.event.repository.name }}
            --var GITHUB_REF:${{ inputs.release_ref }}
            --var PROBE_VERSION:${{ inputs.release_ref }}
