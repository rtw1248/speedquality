name: deploy-speedquality-worker

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Existing signed release tag to deploy
        required: true
        default: v1.0.0
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify release tag
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
        run: |
          [[ "$RELEASE_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          git rev-parse --verify --quiet "refs/tags/$RELEASE_REF"
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: deploy/cloudflare-worker
          wranglerVersion: 4.141.0
          command: >-
            deploy
            --var GITHUB_OWNER:${{ github.repository_owner }}
            --var GITHUB_REPO:${{ github.event.repository.name }}
            --var GITHUB_REF:${{ inputs.release_ref }}
            --var PROBE_VERSION:${{ inputs.release_ref }}
